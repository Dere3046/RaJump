apply plugin: 'com.android.application'

android {
    namespace 'rahook'
    compileSdk 34
    defaultConfig {
        applicationId "rahook"
        minSdk 21
        targetSdk 34
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
        externalNativeBuild {
            cmake { cppFlags "-std=gnu11" }
        }
    }
    externalNativeBuild {
        cmake { path "CMakeLists.txt" }
    }
}
