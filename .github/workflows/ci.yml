name: CI

on: [push, pull_request]

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build all tests
        run: |
          mkdir -p build
          for test in test_core test_mode test_api test_concurrent test_safety \
                      test_stress test_perf test_bytesig test_memory test_regress; do
            gcc -w -O2 -std=gnu11 -no-pie -D_GNU_SOURCE -DRH_ARCH_X86_64=1 \
              -I. -Icore -Iarch/x86_64 -Iarch/x86 -Itests \
              -Ithird_party/xdl -Ithird_party/xdl/android \
              -Ithird_party/bsd -Ithird_party/hde64 \
              -o build/$test tests/$test.c \
              core/rh_ref.c core/rh_safe.c core/rh_trampo.c core/rh_island.c \
              core/rh_linker.c core/rh_hub.c core/rh_mode.c core/rh_recorder.c \
              core/rh_bytesig.c core/rh_deflector.c core/rh_invocation_stack.c \
              arch/x86_64/rh_x64.c arch/x86_64/rh_x64_inst.c \
              arch/x86/rh_ia32.c arch/x86/rh_x86_inst.c \
              third_party/xdl/xdl.c third_party/xdl/xdl_iterate.c \
              third_party/xdl/xdl_linker.c third_party/xdl/xdl_lzma.c \
              third_party/xdl/xdl_util.c third_party/hde64/hde64.c rahook.c \
              -lpthread -ldl -lz
          done
      - name: run tests
        run: |
          fail=0
          for test in test_core test_mode test_api test_concurrent test_safety \
                      test_stress test_perf test_bytesig test_memory test_regress; do
            echo "=== $test ==="
            timeout 30 build/$test 2>&1 | tail -2
            echo "$result" | grep -q "0 failed" || fail=1
          done
          exit $fail

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: setup NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "NDK=$PWD/android-ndk-r27c" >> $GITHUB_ENV
      - name: compile rahook.c for ${{ matrix.abi }}
        run: |
          case ${{ matrix.abi }} in
            arm64-v8a) T=aarch64-linux-android21; D=ARM64; A=arm64 ;;
            armeabi-v7a) T=armv7a-linux-androideabi21; D=ARM; A=arm ;;
            x86) T=i686-linux-android21; D=X86; A=x86 ;;
            x86_64) T=x86_64-linux-android21; D=X86_64; A=x86_64 ;;
          esac
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            --target=$T -DANDROID -D_GNU_SOURCE -DRH_ARCH_$D=1 \
            -std=gnu11 -O2 -fPIC -c \
            -I. -Icore -Iarch/$A -Ithird_party/xdl -Ithird_party/bsd -Ithird_party/hde64 \
            -o /dev/null rahook.c
          echo "RAHOOK COMPILE OK: ${{ matrix.abi }}"
